<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Grocery Inventory Tracker</title>
   <style>
       body {
           font-family: Arial, sans-serif;
           text-align: center;
           margin-top: 150px;
           background-color: #f1f8e9;
       }
       h1 {
           color: #33691e;
           font-size: 28px;
       }
       p {
           color: #555;
           font-size: 18px;
       }
       .button {
           display: inline-block;
           padding: 12px 25px;
           margin: 15px;
           text-decoration: none;
           color: #26320b;
           background-color: #dce775;
           border-radius: 4px;
       }
       .button:hover {
           background-color: #c0ca33;
       }
       .signup {
           background-color: #aed581;
       }
       .signup:hover {
           background-color: #8bc34a;
       }
   </style>
</head>
<body>
   <h1>Grocery Inventory Tracker</h1>
   <p>Welcome! Please Sign Up or Sign In to use the application.</p>
   <a href="/signup" class="button signup">Sign Up</a>
   <a href="/signin" class="button">Sign In</a>
</body>
</html>
