<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign In</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f1f8e9;
        }
        h1, h2 {
            color: #33691e;
            font-size: 24px;
        }
        form {
            display: inline-block;
            text-align: left;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px #c5d6b5;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #bdbdbd;
            box-sizing: border-box;
        }
        input[type="submit"], button {
            background-color: #dce775;
            color: #26320b;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover, button:hover {
            background-color: #c0ca33;
        }
    </style>
</head>
<body>
    <h2>User Login</h2>
    <form action="/signin" method="post">
        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>
        <label>Password:</label>
        <input type="password" name="password" required>
        <br><br>
        <input type="submit" value="Sign In">
    </form>
</body>
</html>
