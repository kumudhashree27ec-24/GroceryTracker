<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f1f8e9;
        }
        h1, h2 {
            color: #33691e;
        }
        .container {
            display: inline-block;
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px #c5d6b5;
        }
        p {
            color: #555;
        }
        .button, button {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            text-decoration: none;
            color: #26320b;
            background-color: #dce775;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .button:hover, button:hover {
            background-color: #c0ca33;
        }
    </style>
</head>
<body>
    <h2>Welcome to the Dashboard</h2>
    <div class="container">
        <h1>Grocery Inventory Tracker</h1>
        <p>
            Manage your grocery items easily and keep track of your inventory.
        </p>
        <a href="/additems" class="button">
            Add Items
        </a>
        <a href="/verifyitems" class="button">
            Verify Items
        </a>
    </div>
    <p>You are successfully logged in!</p>
    <a href="/logout">
        <button>Log Out</button>
    </a>
</body>
</html>
