<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f6f8;
            justify-content: center;
            align-items: center;
        }
        h1 {
            color: #333;
            border-radius: 5px;
            font-size: 24px;
        }
        .container {
            display: inline-block;
            text-align: left;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            text-decoration: none;
            color: rgb(0, 0, 0);
            background-color: #d8f599;
        }
        .button:hover {
            background-color: #c8e64a;
        }
    </style>
</head>
<body>
    <h2>Welcome to the Dashboard</h2>
    <div class="container">
        <h1>Grocery Inventory Tracker</h1>
        <p>
            Manage your grocery items easily and keep track of your inventory.
        </p>
        <a href="/additems" class="button">
            Add Items
        </a>
        <a href="/verifyitems" class="button">
            Verify Items
        </a>
    </div>
    <p>You are successfully logged in!</p>
    <a href="/logout">
        <button>Log Out</button>
    </a>
</body>
</html>
